name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22.17
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'

      - name: Enable pnpm 10.4.1
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
          pnpm --version

      - name: Install native document readers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-por tesseract-ocr-eng

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test suite
        run: pnpm exec vitest run

      - name: Production build
        run: pnpm run build

      - name: Validate runtime bundles
        run: |
          test -f dist/index.js
          test -f dist/backfill-laudos.js
          node --check dist/index.js
          node --check dist/backfill-laudos.js
